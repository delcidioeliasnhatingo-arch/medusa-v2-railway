name: Neon staging migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate staging secret exists
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add NEON_STAGING_DATABASE_URL as a GitHub Actions secret. It must point to the aveart-medusa-staging branch, not production."
            exit 1
          fi
          if [[ "$DATABASE_URL" != *"neon.tech"* ]]; then
            echo "::error::DATABASE_URL does not look like a Neon connection string. Stopping before migrations."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run Medusa database migrations on staging
        run: npx medusa db:migrate
