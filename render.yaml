services:
  - type: web
    name: aveart-medusa-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: MEDUSA_WORKER_MODE
        value: shared
      - key: MIGRATE_ON_BOOT
        value: "true"
      - key: DISABLE_MEDUSA_ADMIN
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MEDUSA_ADMIN_EMAIL
        value: delcidioeliasnhatingo@gmail.com
      - key: MEDUSA_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CORS
        sync: false
      - key: AUTH_CORS
        sync: false
      - key: STORE_CORS
        sync: false
      - key: DEBITOPAY_API_KEY
        sync: false
      - key: DEBITOPAY_MERCHANT_ID
        sync: false
      - key: DEBITOPAY_WALLET_CODE
        sync: false
      - key: DEBITOPAY_API_BASE_URL
        value: https://gyqoaningqhurhvdugne.supabase.co/functions/v1
      - key: DEBITOPAY_PAYMENT_ENDPOINT
        value: payment-orchestrator
      - key: DEBITOPAY_WEBHOOK_SECRET
        sync: false
      - key: DEBITOPAY_RETURN_URL
        sync: false
